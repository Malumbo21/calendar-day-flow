pre-commit:
  jobs:
    - run: pnpm --filter @dayflow/core run check:css

    # Staged files only: running on the whole repo rewrites unrelated files and leaves them unstaged
    - run: pnpm exec oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

    - run: pnpm exec oxlint --fix {staged_files}
      glob:
        - '*.js'
        - '*.jsx'
        - '*.ts'
        - '*.tsx'
        - '*.json'
        - '*.jsonc'
        - '*.css'
        - '*.md'
      stage_fixed: true

    - glob: 'website/**'
      run: pnpm --dir website run build
